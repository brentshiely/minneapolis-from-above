<title>God Mode Backlog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #eef1f0;
  --surface: #fbfcfb;
  --ink: #14202b;
  --muted: #5b6874;
  --line: #d3d9dc;
  --accent: #2f63c9;
  --accent-ink: #ffffff;
  --doing: #b9791a;
  --doing-soft: #f6e6c7;
  --done: #2e8a5b;
  --done-soft: #d9efe3;
  --later: #7a6fb0;
  --danger: #b43c32;
  --focus: #2f63c9;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d141c;
    --surface: #152029;
    --ink: #e4e9ec;
    --muted: #8e9ba6;
    --line: #26333e;
    --accent: #6f9dff;
    --accent-ink: #0d141c;
    --doing: #e7a948;
    --doing-soft: #3a2c14;
    --done: #5cc48f;
    --done-soft: #16322a;
    --later: #a79ce0;
    --danger: #ef7b70;
    --focus: #6f9dff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d141c;
  --surface: #152029;
  --ink: #e4e9ec;
  --muted: #8e9ba6;
  --line: #26333e;
  --accent: #6f9dff;
  --accent-ink: #0d141c;
  --doing: #e7a948;
  --doing-soft: #3a2c14;
  --done: #5cc48f;
  --done-soft: #16322a;
  --later: #a79ce0;
  --danger: #ef7b70;
  --focus: #6f9dff;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 48px; }
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 22px; }

header { display: grid; gap: 10px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.meter { display: grid; gap: 6px; }
.meter-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.meter-bar span { display: block; height: 100%; }
.meter-bar .m-done { background: var(--done); }
.meter-bar .m-doing { background: var(--doing); }
.meter-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter-legend b { color: var(--ink); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.banner { font-size: 13px; padding: 8px 12px; border-radius: 6px; background: var(--doing-soft); color: var(--ink); }

section { display: grid; gap: 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h2 { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .09em; text-transform: uppercase; margin: 0; color: var(--muted); }
.count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
ol.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.empty { font-size: 13px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: 6px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; padding: 10px 10px 10px 8px; align-items: start; }
.card.doing { border-color: var(--doing); box-shadow: inset 3px 0 0 var(--doing); }
.card.done { background: transparent; }
.card.dragging { opacity: .45; }
.card.drop-above { box-shadow: 0 -3px 0 var(--accent); }
.card.drop-below { box-shadow: 0 3px 0 var(--accent); }
.grip { width: 22px; align-self: stretch; display: grid; place-items: center; color: var(--muted); cursor: grab; border-radius: 4px; font-size: 14px; user-select: none; }
.grip:active { cursor: grabbing; }
.card.done .grip { cursor: default; visibility: hidden; }
.main { min-width: 0; display: grid; gap: 3px; }
.line1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.key { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.title { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.card.done .title { color: var(--muted); }
.detail { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
.chip { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
.chip.st-doing { background: var(--doing-soft); border-color: transparent; color: var(--ink); }
.chip.st-done { background: var(--done-soft); border-color: transparent; color: var(--ink); }
.chip.ph-later { color: var(--later); border-color: var(--later); }
.chip a { color: inherit; }
a { color: var(--accent); }
.tools { display: flex; gap: 2px; }
button { font: inherit; }
.icon-btn { background: none; border: 1px solid transparent; color: var(--muted); border-radius: 4px; width: 28px; height: 28px; display: grid; place-items: center; cursor: pointer; font-size: 14px; }
.icon-btn:hover { border-color: var(--line); color: var(--ink); }
.icon-btn:disabled { opacity: .3; cursor: default; border-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

form.edit { grid-column: 1 / -1; display: grid; gap: 8px; padding-top: 6px; }
.field { display: grid; gap: 3px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
input[type=text], textarea, select { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row .field { flex: 1 1 140px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 5px; padding: 6px 12px; cursor: pointer; font-weight: 500; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.spacer { flex: 1; }
.add { justify-self: start; }
details.done-wrap > summary { cursor: pointer; list-style: none; }
details.done-wrap > summary::-webkit-details-marker { display: none; }
details.done-wrap > summary h2::before { content: "▸ "; }
details.done-wrap[open] > summary h2::before { content: "▾ "; }
details.done-wrap > ol { margin-top: 8px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .12s, opacity .12s; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Minneapolis God Mode · build backlog</div>
    <h1>Backlog</h1>
    <div class="meter" id="meter"></div>
    <p class="note">Drag or use the arrows to reorder. Claude takes the top story in <b>Up next</b> each time, and every finished story links to its commit.</p>
    <div class="banner" id="banner" hidden></div>
  </header>

  <section id="sec-doing">
    <div class="sec-head"><h2>In progress</h2><span class="count" id="c-doing"></span></div>
    <ol class="list" id="list-doing"></ol>
  </section>

  <section id="sec-todo">
    <div class="sec-head"><h2>Up next</h2><span class="count" id="c-todo"></span></div>
    <ol class="list" id="list-todo"></ol>
    <button class="btn add" id="add-btn" type="button">+ Add story</button>
  </section>

  <section>
    <details class="done-wrap" id="done-wrap" open>
      <summary><div class="sec-head"><h2>Done</h2><span class="count" id="c-done"></span></div></summary>
      <ol class="list" id="list-done"></ol>
    </details>
  </section>
</div>

<script>
(function () {
  let db = null, col = null;
  let stories = [];          // [{id, ...data}]
  let editing = null;        // doc id being edited, or "__new"
  let readOnly = false;
  let dragId = null;
  const $ = (id) => document.getElementById(id);

  function banner(msg) { const b = $("banner"); b.textContent = msg || ""; b.hidden = !msg; }

  function byRank(a, b) { return (a.rank ?? 0) - (b.rank ?? 0); }
  function group(status) { return stories.filter(s => (s.status || "todo") === status).sort(byRank); }

  function nextKey() {
    let max = 0;
    for (const s of stories) { const m = /GM-(\d+)/.exec(s.key || ""); if (m) max = Math.max(max, +m[1]); }
    return "GM-" + String(max + 1).padStart(2, "0");
  }

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") n.className = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
    return n;
  }

  function renderMeter() {
    const total = stories.length || 1;
    const d = group("done").length, g = group("doing").length, t = group("todo").length;
    const mvp = stories.filter(s => (s.phase || "MVP") === "MVP");
    const mvpDone = mvp.filter(s => s.status === "done").length;
    $("meter").replaceChildren(
      el("div", { class: "meter-bar", role: "img", "aria-label": d + " done, " + g + " in progress, " + t + " to do" },
        el("span", { class: "m-done", style: "width:" + (d / total * 100) + "%" }),
        el("span", { class: "m-doing", style: "width:" + (g / total * 100) + "%" })),
      el("div", { class: "meter-legend" },
        el("span", null, el("b", null, String(d)), " done"),
        el("span", null, el("b", null, String(g)), " in progress"),
        el("span", null, el("b", null, String(t)), " to do"),
        el("span", null, "MVP ", el("b", null, mvpDone + "/" + mvp.length))));
  }

  function editForm(s) {
    const isNew = !s;
    s = s || { title: "", detail: "", phase: "MVP", status: "todo" };
    const f = el("form", { class: "edit" },
      el("div", { class: "field" }, el("label", { for: "f-title" }, "Title"),
        el("input", { type: "text", id: "f-title", value: s.title || "", required: true, maxlength: "140" })),
      el("div", { class: "field" }, el("label", { for: "f-detail" }, "Detail and acceptance criteria"),
        el("textarea", { id: "f-detail" }, s.detail || "")),
      el("div", { class: "row" },
        el("div", { class: "field" }, el("label", { for: "f-phase" }, "Phase"),
          sel("f-phase", ["MVP", "Later"], s.phase || "MVP")),
        el("div", { class: "field" }, el("label", { for: "f-status" }, "Status"),
          sel("f-status", [["todo", "Up next"], ["doing", "In progress"], ["done", "Done"]], s.status || "todo"))),
      el("div", { class: "actions" },
        el("button", { class: "btn primary", type: "submit" }, isNew ? "Add story" : "Save"),
        el("button", { class: "btn", type: "button", onclick: () => { editing = null; render(); } }, "Cancel"),
        el("span", { class: "spacer" }),
        isNew ? null : el("button", { class: "btn danger", type: "button", id: "f-del",
          onclick: (e) => confirmDelete(e.currentTarget, s.id) }, "Delete")));
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = {
        title: $("f-title").value.trim(),
        detail: $("f-detail").value.trim(),
        phase: $("f-phase").value,
        status: $("f-status").value,
        updatedAt: new Date().toISOString(),
      };
      if (!body.title) return;
      try {
        if (isNew) {
          const todo = group("todo");
          body.key = nextKey();
          body.rank = todo.length ? (todo[todo.length - 1].rank ?? 0) + 1000 : 1000;
          await col.doc(body.key).set(body);
        } else {
          await col.doc(s.id).update(body);
        }
        editing = null; render();
      } catch (err) { writeFailed(err); }
    });
    setTimeout(() => { const t = $("f-title"); if (t) t.focus(); }, 0);
    return f;
  }

  function sel(id, opts, value) {
    const s = el("select", { id });
    for (const o of opts) {
      const [v, label] = Array.isArray(o) ? o : [o, o];
      const op = el("option", { value: v }, label); if (v === value) op.selected = true; s.append(op);
    }
    return s;
  }

  function confirmDelete(btn, id) {
    if (btn.dataset.armed) {
      col.doc(id).delete().then(() => { editing = null; render(); }).catch(writeFailed);
    } else {
      btn.dataset.armed = "1"; btn.textContent = "Confirm delete";
    }
  }

  function card(s, idx, list) {
    const status = s.status || "todo";
    const li = el("li", { class: "card " + status, "data-id": s.id });
    const movable = status !== "done" && !readOnly;
    const grip = el("div", { class: "grip", "aria-hidden": "true", title: "Drag to reorder" }, "⋮⋮");
    if (movable) {
      li.draggable = true;
      li.addEventListener("dragstart", (e) => { dragId = s.id; li.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", s.id); } catch (_) {} });
      li.addEventListener("dragend", () => { dragId = null; li.classList.remove("dragging"); clearDrop(); });
      li.addEventListener("dragover", (e) => {
        if (!dragId || dragId === s.id) return;
        const from = stories.find(x => x.id === dragId);
        if (!from || (from.status || "todo") !== status) return;
        e.preventDefault();
        const r = li.getBoundingClientRect(); const above = e.clientY < r.top + r.height / 2;
        clearDrop(); li.classList.add(above ? "drop-above" : "drop-below");
      });
      li.addEventListener("drop", (e) => {
        e.preventDefault();
        const above = li.classList.contains("drop-above"); clearDrop();
        if (!dragId || dragId === s.id) return;
        const rest = list.filter(x => x.id !== dragId);
        const at = rest.findIndex(x => x.id === s.id) + (above ? 0 : 1);
        moveTo(dragId, rest, at);
      });
    }
    const chips = el("div", { class: "chips" },
      status === "doing" ? el("span", { class: "chip st-doing" }, "in progress") : null,
      status === "done" ? el("span", { class: "chip st-done" }, "done") : null,
      (s.phase || "MVP") === "Later" ? el("span", { class: "chip ph-later" }, "later") : el("span", { class: "chip" }, "MVP"),
      s.commit ? el("span", { class: "chip" }, el("a", { href: s.commit, target: "_blank", rel: "noopener" }, "commit " + (s.sha || shortSha(s.commit)))) : null);
    const main = el("div", { class: "main" },
      el("div", { class: "line1" }, el("span", { class: "key" }, s.key || ""), el("span", { class: "title" }, s.title || "(untitled)")),
      s.detail ? el("div", { class: "detail" }, s.detail) : null,
      chips);
    const tools = el("div", { class: "tools" },
      movable ? el("button", { class: "icon-btn", type: "button", "aria-label": "Move up", title: "Move up", disabled: idx === 0,
        onclick: () => { const rest = list.filter(x => x.id !== s.id); moveTo(s.id, rest, idx - 1); } }, "↑") : null,
      movable ? el("button", { class: "icon-btn", type: "button", "aria-label": "Move down", title: "Move down", disabled: idx === list.length - 1,
        onclick: () => { const rest = list.filter(x => x.id !== s.id); moveTo(s.id, rest, idx + 1); } }, "↓") : null,
      readOnly ? null : el("button", { class: "icon-btn", type: "button", "aria-label": "Edit " + (s.key || "story"), title: "Edit",
        onclick: () => { editing = s.id; render(); } }, "✎"));
    li.append(grip, main, tools);
    if (editing === s.id) li.append(editForm(s));
    return li;
  }

  function shortSha(url) { const m = /commit\/([0-9a-f]{7})/.exec(url || ""); return m ? m[1] : ""; }
  function clearDrop() { document.querySelectorAll(".drop-above,.drop-below").forEach(n => n.classList.remove("drop-above", "drop-below")); }

  async function moveTo(id, rest, at) {
    at = Math.max(0, Math.min(rest.length, at));
    const prev = rest[at - 1], next = rest[at];
    let rank;
    if (prev && next) rank = ((prev.rank ?? 0) + (next.rank ?? 0)) / 2;
    else if (prev) rank = (prev.rank ?? 0) + 1000;
    else if (next) rank = (next.rank ?? 0) - 1000;
    else rank = 1000;
    const s = stories.find(x => x.id === id); if (!s) return;
    s.rank = rank; render();   // optimistic
    try { await col.doc(id).update({ rank, updatedAt: new Date().toISOString() }); } catch (err) { writeFailed(err); }
  }

  function writeFailed(err) {
    if (err && err.code === "invalid_argument") { readOnly = true; banner("You can view this backlog but not change it."); }
    else banner("That change didn't save. Try again in a moment.");
    render();
  }

  function renderList(status, listId, countId, emptyText) {
    const list = group(status);
    $(countId).textContent = String(list.length);
    const ol = $(listId);
    if (!list.length) ol.replaceChildren(el("li", { class: "empty" }, emptyText));
    else ol.replaceChildren(...list.map((s, i) => card(s, i, list)));
  }

  function render() {
    renderMeter();
    renderList("doing", "list-doing", "c-doing", "Nothing in progress.");
    renderList("todo", "list-todo", "c-todo", "No stories queued.");
    renderList("done", "list-done", "c-done", "No stories finished yet.");
    const addBtn = $("add-btn");
    addBtn.hidden = readOnly || editing === "__new";
    const holder = $("new-holder");
    if (holder) holder.remove();
    if (editing === "__new") {
      const wrap = el("li", { class: "card", id: "new-holder" }, el("div"), el("div", { class: "main" }, el("div", { class: "title" }, "New story")), el("div"));
      wrap.append(editForm(null));
      $("list-todo").append(wrap);
    }
  }

  $("add-btn").addEventListener("click", () => { editing = "__new"; render(); });

  render();

  (async () => {
    try { db = await window.claude?.use?.("db"); } catch (_) { db = null; }
    if (!db) { readOnly = true; banner("The backlog store isn't available in this view."); render(); return; }
    try {
      const user = await window.claude.use("user");
      if (user && user.can && user.can("data.write") === false) readOnly = true;
    } catch (_) {}
    col = db.collection("stories");
    col.onSnapshot((snap) => {
      stories = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      // keep an open edit form open across snapshots unless its story vanished
      if (editing && editing !== "__new" && !stories.some(s => s.id === editing)) editing = null;
      const active = document.activeElement;
      if (editing && active && active.closest && active.closest("form.edit")) { renderMeter(); return; }
      render();
    }, () => { banner("Live updates stopped. Reload to reconnect."); });
  })();
})();
</script>
